[package]
name = "rustypi-user"
version = "0.1.0"
edition = "2021"
description = "Runtime for RustyPI user programs: entry point, system calls, printing, panics"

[dependencies]
rustypi-abi = { path = "../rustypi-abi" }
# For its heap allocator; linking with LTO keeps only what is used.
rustypi-core = { path = "../rustypi-core" }

[build-dependencies]
rustypi-abi = { path = "../rustypi-abi" }
